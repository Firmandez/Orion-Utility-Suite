name: Release

on:
  push:
    tags:
      - 'v*' # Memicu build otomatis setiap kali Anda push tag versi baru (misal: v0.2.8)

jobs:
  release:
    permissions:
      contents: write # Diperlukan untuk mengupload file installer ke GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download yt-dlp and ffmpeg
        shell: pwsh
        run: |
          # Create tools directory
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/tools/yt-dlp"

          # Download yt-dlp
          Write-Host "Downloading yt-dlp..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.03.17/yt-dlp.exe" -OutFile "src-tauri/resources/tools/yt-dlp/yt-dlp.exe"

          # Download ffmpeg essentials build
          Write-Host "Downloading ffmpeg..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.1-essentials_build.zip" -OutFile "ffmpeg.zip"

          # Extract and copy ffmpeg.exe and ffprobe.exe
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
          $ffmpegBin = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeBin = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName -Destination "src-tauri/resources/tools/yt-dlp/ffmpeg.exe"
          Copy-Item $ffprobeBin.FullName -Destination "src-tauri/resources/tools/yt-dlp/ffprobe.exe"

          # Cleanup
          Remove-Item "ffmpeg.zip" -Force
          Remove-Item "ffmpeg_temp" -Recurse -Force

          # Verify
          Write-Host "Tools downloaded:"
          Get-ChildItem "src-tauri/resources/tools/yt-dlp" | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Verify Windows bundled tools
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.windows.conf.json" -Raw | ConvertFrom-Json
          $requiredResource = "resources/tools/yt-dlp/*"
          if ($config.bundle.resources -notcontains $requiredResource) {
            throw "Windows bundle resources must include $requiredResource"
          }

          $requiredTools = "yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe"
          foreach ($tool in $requiredTools) {
            $path = Join-Path "src-tauri/resources/tools/yt-dlp" $tool
            if (-not (Test-Path $path)) {
              throw "Missing required bundled tool: $path"
            }
          }

          Write-Host "Windows bundle configuration includes all required yt-dlp tools."

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Orion v__VERSION__"
          releaseBody: |
            ### Detail Update v__VERSION__
            * (Tambahkan detail fitur baru atau perubahan di sini...)
            * (Perbaikan bug atau peningkatan performa...)
            
            ---
            *Rilis ini ditandatangani secara digital demi keamanan sistem dan integritas aplikasi.*
          releaseDraft: true # Menghasilkan rilis sebagai DRAFT di GitHub agar Anda bisa meninjau sebelum dipublikasikan
          prerelease: false

      - name: Rename and upload portable binary
        shell: pwsh
        run: |
          $version = (Get-Content ./package.json | ConvertFrom-Json).version
          $zipName = "orion-utility-suite_${version}_x64_portable.zip"
          
          # Create temporary folder for portable zip package
          New-Item -ItemType Directory -Force -Path "./temp_portable/resources/pdfium/windows-x64"
          New-Item -ItemType Directory -Force -Path "./temp_portable/resources/tools/yt-dlp"
          Copy-Item "src-tauri/target/release/orion-utility-suite.exe" -Destination "./temp_portable/orion-utility-suite.exe"
          Copy-Item "src-tauri/resources/pdfium/windows-x64/pdfium.dll" -Destination "./temp_portable/resources/pdfium/windows-x64/pdfium.dll"
          Copy-Item "src-tauri/resources/tools/yt-dlp/yt-dlp.exe" -Destination "./temp_portable/resources/tools/yt-dlp/yt-dlp.exe"
          Copy-Item "src-tauri/resources/tools/yt-dlp/ffmpeg.exe" -Destination "./temp_portable/resources/tools/yt-dlp/ffmpeg.exe"
          Copy-Item "src-tauri/resources/tools/yt-dlp/ffprobe.exe" -Destination "./temp_portable/resources/tools/yt-dlp/ffprobe.exe"
          
          # Compress the folder into a zip archive
          Compress-Archive -Path "./temp_portable/*" -DestinationPath "./$zipName" -Force
          
          # Upload only the bundled ZIP to GitHub Release
          gh release upload "v$version" "./$zipName" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
