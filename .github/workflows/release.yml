name: Release

on:
  push:
    tags:
      - 'v*' # Memicu build otomatis setiap kali Anda push tag versi baru (misal: v0.2.8)

jobs:
  release:
    permissions:
      contents: write # Diperlukan untuk mengupload file installer ke GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Orion v__VERSION__"
          releaseBody: |
            ### Detail Update v__VERSION__
            * (Tambahkan detail fitur baru atau perubahan di sini...)
            * (Perbaikan bug atau peningkatan performa...)
            
            ---
            *Rilis ini ditandatangani secara digital demi keamanan sistem dan integritas aplikasi.*
          releaseDraft: true # Menghasilkan rilis sebagai DRAFT di GitHub agar Anda bisa meninjau sebelum dipublikasikan
          prerelease: false

      - name: Rename and upload portable binary
        shell: pwsh
        run: |
          $version = (Get-Content ./package.json | ConvertFrom-Json).version
          $zipName = "orion-utility-suite_${version}_x64_portable.zip"
          
          # Create temporary folder for portable zip package
          New-Item -ItemType Directory -Force -Path "./temp_portable/resources/pdfium/windows-x64"
          Copy-Item "src-tauri/target/release/orion-utility-suite.exe" -Destination "./temp_portable/orion-utility-suite.exe"
          Copy-Item "src-tauri/resources/pdfium/windows-x64/pdfium.dll" -Destination "./temp_portable/resources/pdfium/windows-x64/pdfium.dll"
          
          # Compress the folder into a zip archive
          Compress-Archive -Path "./temp_portable/*" -DestinationPath "./$zipName" -Force
          
          # Upload only the bundled ZIP to GitHub Release
          gh release upload "v$version" "./$zipName" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
