name: Release

on:
  push:
    tags:
      - 'v*' # Memicu build otomatis setiap kali Anda push tag versi baru (misal: v0.2.8)

jobs:
  release:
    permissions:
      contents: write # Diperlukan untuk mengupload file installer ke GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Orion v__VERSION__"
          releaseBody: "Rilis otomatis Orion Utility Suite oleh GitHub Actions dengan penandatanganan kunci digital sign."
          releaseDraft: true # Menghasilkan rilis sebagai DRAFT di GitHub agar Anda bisa meninjau sebelum dipublikasikan
          prerelease: false

      - name: Rename and upload portable binary
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PORTABLE_NAME="orion-utility-suite_${VERSION}_x64_portable.exe"
          cp src-tauri/target/release/orion-utility-suite.exe ./$PORTABLE_NAME
          gh release upload v$VERSION ./$PORTABLE_NAME --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
