[package]
name = "orion-utility-suite"
version = "0.4.8"
description = "Cross-platform offline-first desktop utility suite"
authors = ["Firmandez"]
license = "MIT"
homepage = "https://github.com/Firmandez"
edition = "2021"

[lib]
name = "orion_utility_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hickory-resolver = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
local-ip-address = "0.6"
lopdf = "0.35"
md5 = "0.7"
open = "5"
pdfium-render = { version = "0.9.1", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
printpdf = { version = "0.8", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rqrr = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
